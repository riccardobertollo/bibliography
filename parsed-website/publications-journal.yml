- citation: "R. Bertollo, S.J.A.M. van den Eijnden, W.P.M.H. Heemels, <b>'Incremental stability and convergence properties of discrete-time projected control systems'</b>, <i>Nonlinear Analysis: Hybrid Systems</i>, vol. 63, pp. 101813, 2027. doi: 10.1016/j.nahs.2026.101813."
  url: https://www.sciencedirect.com/science/article/pii/S1751570X26001391
  abstract: "Projection-based controllers can overcome fundamental limitations of classical linear time-invariant control by modifying the controller's input-output behavior via projection. A key example is given by the hybrid integrator-gain system, a projected integrator, which has recently found successful application in several industrial systems. While prior work on analysis and design of projection-based control systems has primarily focused on the continuous-time setting and non-incremental analysis, a more refined incremental analysis in discrete-time is needed to better reflect actual digital implementation and obtain more accurate (robust) performance assessment. To address this need, this paper considers incremental stability and convergence analysis of discrete-time projection-based control systems. Our first methodology is based on showing that such controllers preserve the quadratic incremental stability of their nominal (unprojected) dynamics, if the projection metric is well-designed. Building on this, we derive a small-gain condition guaranteeing incremental input-to-state stability for interconnections of projected controllers with general nonlinear plants. A second approach is grounded in a direct Lyapunov-based method for verifying incremental stability in input-affine piecewise-smooth systems, which can be seen as an extension of the classical discrete-time Demidovič conditions. We illustrate our results through several examples, and demonstrate performance quantification via nonlinear Bode plots, with a special focus on first-order projection elements."
  bibtex: "@article{BertolloNAHS26Hybrid,<br>author = {Bertollo, R. and {van den Eijnden}, S.J.A.M. and Heemels, W.P.M.H.},<br>title = {Incremental stability and convergence properties of discrete-time projected control systems},<br>journal = {Nonlinear Analysis: Hybrid Systems},<br>year = {2027},<br>volume = {63},<br>pages = {101813},<br>doi = {10.1016/j.nahs.2026.101813}<br>}"


- citation: "R. Bertollo, G. Lunardi, A. Del Prete and L. Zaccarian, <b>'Hybrid Lyapunov-based feedback stabilization of bipedal locomotion based on reference spreading'</b>, <i>Automatica</i>, vol. 174, pp. 112106, 2025. doi: 10.1016/j.automatica.2024.112106."
  url: https://www.sciencedirect.com/science/article/pii/S0005109824005995
  abstract: "We propose a hybrid formulation of the linear inverted pendulum model for bipedal locomotion, where the foot switches are triggered based on the center of mass position, removing the need for pre-defined footstep timings. Using a concept similar to reference spreading, we define nontrivial tracking error coordinates induced by our hybrid model. These coordinates enjoy desirable linear flow dynamics and rather elegant jump dynamics perturbed by a suitable extended class K∞ function of the position error. We stabilize this hybrid error dynamics using a saturated feedback controller, selecting its gains by solving a convex optimization problem. We prove local asymptotic stability of the tracking error and provide a certified estimate of the basin of attraction, comparing it with a numerical estimate obtained from the integration of the closed-loop dynamics. Simulations on a full-body model of a real robot show the practical applicability of the proposed framework and its advantages with respect to a standard model predictive control formulation."
  bibtex: "@article{BertolloAut25Hybrid,<br>author = {Bertollo, R. and Lunardi, G. and {Del Prete}, A. and Zaccarian, L.},<br>title = {Hybrid {L}yapunov-based feedback stabilization of bipedal locomotion based on reference spreading},<br>journal = {Automatica},<br>year = {2025},<br>volume = {174},<br>pages = {112106},<br>doi = {10.1016/j.automatica.2024.112106}<br>}"


- citation: "R. Bertollo, M. Schwegel, A. Kugi and L. Zaccarian, <b>'Integrate-and-Reset Feedback and Feedforward for a Solenoid With Unknown Parameters'</b>, <i>IEEE Control Systems Letters</i>, vol. 8, pp. 1511-1516, 2024. doi: 10.1109/LCSYS.2024.3413360."
  url: https://ieeexplore.ieee.org/abstract/document/10555300
  abstract: "We propose a hybrid feedback-feedforward control scheme for output current tracking in a solenoid, based on an integrate-and-reset paradigm. The feedback, based on a First-Order Reset Element, produces stabilizing inputs comprising diverging exponentials, inducing an aggressive feedback correction. The feedforward uses a hybrid recursive least-squares method with directional forgetting. The hybrid nature of the control loop allows using non-exponentially stable filters, which preserve the past information, as opposed to the stable filters typically used in the adaptive control literature. We prove stability of both the estimation and the tracking error, also using a novel result on forward invariance of a desirable set where the information matrix evolves. Experimental results confirm the effectiveness of the proposed hybrid control scheme."
  bibtex: "@article{BertolloLCSS24Integrate,<br>author = {Bertollo, R. and Schwegel, M. and Kugi, A. and Zaccarian, L.},<br>title = {Integrate-and-Reset Feedback and Feedforward for a Solenoid With Unknown Parameters},<br>journal = {IEEE Control Systems Letters},<br>year = {2024},<br>volume = {8},<br>pages = {1511-1516},<br>doi = {10.1109/LCSYS.2024.3413360}<br>}"


- citation: "S. Mariano, R. Bertollo, R. Postoyan and L. Zaccarian, <b>'Hybrid coupling rules for leaderless heterogeneous oscillators: Uniform global asymptotic and finite-time synchronization'</b>, <i>Automatica</i>, vol. 159, pp. 111324, 2024. doi: 10.1016/j.automatica.2023.111324."
  url: https://www.sciencedirect.com/science/article/pii/S0005109823004909
  abstract: "We investigate the engineering scenario where the objective is to synchronize heterogeneous oscillators in a distributed fashion. The internal dynamics of each oscillator are general enough to capture their time-varying natural frequency as well as physical couplings and unknown bounded terms. A communication layer is set in place to allow the oscillators to exchange synchronizing coupling actions through a tree-like leaderless network. In particular, we present a class of hybrid coupling rules depending only on local information to ensure uniform global practical or asymptotic synchronization, which is impossible to obtain by using the Kuramoto model customarily used in the literature. We further show that the synchronization set can be made uniformly globally prescribed finite-time stable by selecting the coupling function to be discontinuous at the origin. Novel mathematical tools on non-pathological functions and set-valued Lie derivatives are developed to carry out the stability analysis. The effectiveness of the approach is illustrated in simulations where we apply our synchronizing hybrid coupling rules to models of power grids previously used in the literature."
  bibtex: "@article{MarianoAut24Hybrid,<br>author = {Mariano, S. and Bertollo, R. and Postoyan, R. and Zaccarian, L.},<br>title = {Hybrid coupling rules for leaderless heterogeneous oscillators: Uniform global asymptotic and finite-time synchronization},<br>journal = {Automatica},<br>year = {2024},<br>volume = {159},<br>pages = {111324},<br>doi = {10.1016/j.automatica.2023.111324}<br>}"


- citation: "R. Bertollo, A.R. Teel and L. Zaccarian, <b>'Soft-Reset Control With Max-of-Quadratics Lyapunov Certificates'</b>, <i>IEEE Transactions on Automatic Control</i>, vol. 68, no. 9, pp. 5245-5257, 2023. doi: 10.1109/TAC.2022.3221684."
  url: https://ieeexplore.ieee.org/abstract/document/9946305/keywords#keywords
  abstract: "In this article, we further develop a novel control paradigm encoding the core behavior of a reset control system within a continuous-time feedback, described by a differential inclusion. A tuning knob allows adjusting how close the continuous-time feedback resembles the behavior of the underlying reset controller. The Lyapunov conditions that we derive naturally lead to a sum-of-squares formulation allowing for the design of max-of-quadratics Lyapunov certificates associated with polynomial multipliers. A few application examples confirm the practical effectiveness of the proposed solutions."
  bibtex: "@article{BertolloTAC23Soft,<br>author = {Bertollo, Riccardo and Teel, Andrew R. and Zaccarian, Luca},<br>title = {Soft-Reset Control With Max-of-Quadratics {L}yapunov Certificates},<br>journal = {IEEE Transactions on Automatic Control},<br>year = {2023},<br>volume = {68},<br>number = {9},<br>pages = {5245-5257},<br>doi = {10.1109/TAC.2022.3221684}<br>}"


- citation: "R. Bertollo, P. Millán, L. Orihuela, A. Seuret and L. Zaccarian, <b>'Distributed Hybrid Observer With Prescribed Convergence Rate for a Linear Plant Using Multi-Hop Decomposition'</b>, <i>IEEE Control Systems Letters</i>, vol. 7, pp. 331-336, 2023. doi: 10.1109/LCSYS.2022.3188476."
  url: https://ieeexplore.ieee.org/abstract/document/9815089
  abstract: "We propose a distributed hybrid observer for a sensor network where the plant and local observers run in continuous time and the information exchange among the sensing nodes is sampled-data. Process disturbances, measurement noise and communication noise are considered, and we prove that under some necessary detectability assumptions the observer gains can be tuned to guarantee exponential Input-to-State Stability with a prescribed convergence rate. Simulations illustrate the performance of the proposed observer."
