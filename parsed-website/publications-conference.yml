- citation: "R. Bertollo, G.B. Cáceres, P. Millán, M. Pereira and L. Zaccarian, <b>'A hybrid dynamical systems approach to smart irrigation'</b>, <i>IFAC PapersOnLine (IFAC Conference on Sensing, Control and Automation Technologies for Agriculture - AGRICONTROL)</i>, vol. 55, no. 32, pp. 188-193, 2022. doi: 10.1016/j.ifacol.2022.11.137."
  url: https://www.sciencedirect.com/science/article/pii/S2405896322027707
  abstract: "We present a novel model for a drip irrigation system, using a hybrid dynamical systems paradigm to take into account the intrinsic binary nature of the control input. We consider an irrigation pipe with a generic number of drippers, analyzing the effect that the transients in the pipe have on the irrigation uniformity, and propose an intuitive irrigation strategy based on the one currently used by farmers. The model is presented together with simulations, whose parameters are based on real farm data."
  bibtex: "@inproceedings{BertolloAgricontrol22Hybrid,<br>author = {Bertollo, R. and C\\'{a}ceres, G.B. and Mill\\'{a}n, P. and Pereira, M. and Zaccarian, L.},<br>title = {A hybrid dynamical systems approach to smart irrigation},<br>booktitle = {IFAC PapersOnLine (IFAC Conference on Sensing, Control and Automation Technologies for Agriculture - AGRICONTROL)},<br>year = {2022},<br>volume = {55},<br>number = {32},<br>pages = {188-193},<br>doi = {10.1016/j.ifacol.2022.11.137}<br>}"


- citation: "R. Bertollo, M. Schwegel, A. Kugi and L. Zaccarian, <b>'Reset-control-based current tracking for a solenoid with unknown parameters'</b>, <i>IFAC-PapersOnLine (IFAC Conference on Analysis and Design of Hybrid Systems - ADHS)</i>, vol. 54, no. 5, pp. 199-204, 2021. doi: 10.1016/j.ifacol.2021.08.498."
  url: https://www.sciencedirect.com/science/article/pii/S2405896321012738
  abstract: "We propose a hybrid controller for reference tracking for the output current of a solenoid. The solenoid can be modeled as a first-order linear plant with unknown parameters. The proposed hybrid controller comprises 1) a feed forward action, based on an estimate of the unknown plant parameters exploiting a hybrid formulation of the recursive least-squares method, and 2) a feedback action, exploiting a reset control scheme based on a first-order reset element. We prove stability properties for the closed-loop system and we show through simulations that the current output converges to the reference for sufficiently exciting reference signals."
  bibtex: "@inproceedings{BertollADHS21Reset,<br>author = {Bertollo, R. and Schwegel, M. and Kugi, A. and Zaccarian, L.},<br>title = {Reset-control-based current tracking for a solenoid with unknown parameters},<br>booktitle = {IFAC-PapersOnLine (IFAC Conference on Analysis and Design of Hybrid Systems - ADHS)},<br>year = {2021},<br>volume = {54},<br>number = {5},<br>pages = {199-204},<br>doi = {10.1016/j.ifacol.2021.08.498}<br>}"


- citation: "R. Bertollo, E. Panteley, R. Postoyan and L. Zaccarian, <b>'Uniform global asymptotic synchronization of Kuramoto oscillators via hybrid coupling'</b>, <i>IFAC-PapersOnLine (IFAC World Congress)</i>, vol. 53, no. 2, pp. 5819-5824, 2020. doi: 10.1016/j.ifacol.2020.12.1626."
  url: https://www.sciencedirect.com/science/article/pii/S2405896320322229
  abstract: "Using a hybrid framework, we propose a generalized version of the well-known Kuramoto model for interconnected oscillators. The proposed model does not modify the classical model close to the synchronization set, but avoids the typical non-uniform convergence phenomenon. For the two-oscillators case, we prove the uniform global asymptotic stability of the consensus set by using a hybrid Lyapunov function whose generality promises possible extension of the result to higher order dynamics. We comparatively illustrate the achieved uniform convergence properties by simulating both the case with two and multiple oscillators, thus confirming the effectiveness of our approach."
  bibtex: "@inproceedings{BertolloIFAC20Uniform,<br>author = {Bertollo, R. and Panteley, E. and Postoyan, R. and Zaccarian, L.},<br>title = {Uniform global asymptotic synchronization of {K}uramoto oscillators via hybrid coupling},<br>booktitle = {IFAC-PapersOnLine (IFAC World Congress)},<br>year = {2020},<br>volume = {53},<br>number = {2},<br>pages = {5819-5824},<br>doi = {10.1016/j.ifacol.2020.12.1626}<br>}"


